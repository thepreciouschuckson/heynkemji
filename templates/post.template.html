<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — heyNkemji</title>
<meta name="description" content="{{DEK}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,600;1,300;1,400&family=Work+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="masthead">
  <div class="masthead__top wrap">
    <a href="index.html" class="wordmark">hey<em>Nkemji</em></a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <nav class="site-nav" id="site-nav">
    <div class="wrap" style="display:flex; gap:2rem; flex-wrap:wrap;">
      <a href="index.html">Journal</a>
      <a href="archive.html">Archive</a>
      <a href="about.html">About</a>
      <a href="contact.html">Say hello</a>
    </div>
  </nav>
</header>

<main>
  <header class="post-header wrap">
    <div class="entry__meta">
      <time datetime="{{DATE_ISO}}">{{DATE_DISPLAY}}</time>
      <span class="tag">{{TAG}}</span>
    </div>
    <h1>{{TITLE}}</h1>
    <p class="dek">{{DEK}}</p>
  </header>

  <div class="post-body wrap">
    <aside class="post-body__gutter">
      <span>{{READTIME}}</span>
      <span>{{TAG}}</span>
    </aside>
    <div class="post-body__content">
{{CONTENT}}
    </div>
  </div>

  <nav class="post-nav wrap">
    <a href="{{PREV_HREF}}" class="prev">
      <span class="label">← Previous</span>
      <span class="title">{{PREV_TITLE}}</span>
    </a>
    <a href="{{NEXT_HREF}}" class="next">
      <span class="label">Next →</span>
      <span class="title">{{NEXT_TITLE}}</span>
    </a>
  </nav>

  <section class="comments wrap" id="comments">
    <h2 class="comments__heading">Thoughts?</h2>
    <div
      id="cusdis_thread"
      data-host="https://cusdis.com"
      data-app-id="{{CUSDIS_APP_ID}}"
      data-page-id="{{SLUG}}"
      data-page-title="{{TITLE}}"
      data-theme="dark"
    ></div>
    <script>
      // Cusdis needs the live URL of this exact page, which we can only
      // know in the browser — so we set it here before the widget loads.
      document.getElementById("cusdis_thread")
        .setAttribute("data-page-url", window.location.href);

      // Cusdis renders its form inside an iframe it fully controls, so our
      // site CSS can't reach it normally. But that iframe is built with
      // srcdoc (its HTML is handed in as a string, not fetched from a
      // separate page), which means we can catch it the moment it's
      // created and splice our own <style> into it before it renders.
      // This is unofficial — if Cusdis changes their internal markup,
      // this may need updating.
      (function () {
        var target = document.getElementById("cusdis_thread");
        var applied = false;
        var observer = new MutationObserver(function () {
          if (applied) return;
          var iframe = target.querySelector("iframe");
          if (!iframe) return;
          applied = true;
          var css = [
            "html, body { background: transparent !important; }",
            "body {",
            "  padding: 1rem !important;",
            "  font-family: 'Work Sans', sans-serif !important;",
            "}",
            "div, section, form { background: transparent !important; }",
            "input, textarea {",
            "  background: #14110d !important;",
            "  border: 1px solid #332c22 !important;",
            "  border-radius: 2px !important;",
            "  color: #f2e9db !important;",
            "  font-family: 'Work Sans', sans-serif !important;",
            "  width: 100% !important;",
            "  box-sizing: border-box !important;",
            "}",
            "input::placeholder, textarea::placeholder { color: #6f6555 !important; }",
            "label {",
            "  color: #a89984 !important;",
            "  font-family: 'Work Sans', sans-serif !important;",
            "  display: block !important;",
            "  margin-bottom: 0.4rem !important;",
            "}",
            "button {",
            "  background: transparent !important;",
            "  border: 1px solid #cf6a3a !important;",
            "  color: #e8b088 !important;",
            "  border-radius: 2px !important;",
            "  font-family: 'JetBrains Mono', monospace !important;",
            "  text-transform: uppercase !important;",
            "  letter-spacing: 0.08em !important;",
            "}",
            "button:hover { background: #cf6a3a !important; color: #14110d !important; }",
            "a { color: #cf6a3a !important; }",
            "@media (max-width: 480px) {",
            "  div[class*='grid'] { display: block !important; }",
            "  div[class*='grid'] > * { width: 100% !important; margin-bottom: 0.75rem !important; }",
            "}"
          ].join("\n");
          iframe.srcdoc = iframe.srcdoc.replace("</style>", css + "</style>");
        });
        observer.observe(target, { childList: true, subtree: true });
      })();
    </script>
    <script async defer src="https://cusdis.com/js/cusdis.es.js"></script>
  </section>
</main>

<footer class="site-footer wrap">
  <p>heyNkemji — a journal for anything and everything.</p>
  <p class="footer-meta">Abuja ⇄ Accra · © <span id="year"></span></p>
</footer>

<script src="js/main.js"></script>
</body>
</html>
