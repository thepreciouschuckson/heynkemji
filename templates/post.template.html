<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — heyNkemji</title>
<meta name="description" content="{{DEK}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,600;1,300;1,400&family=Work+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="masthead">
  <div class="masthead__top wrap">
    <a href="index.html" class="wordmark">hey<em>Nkemji</em></a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <nav class="site-nav" id="site-nav">
    <div class="wrap" style="display:flex; gap:2rem; flex-wrap:wrap;">
      <a href="index.html">Journal</a>
      <a href="archive.html">Archive</a>
      <a href="about.html">About</a>
      <a href="contact.html">Say hello</a>
    </div>
  </nav>
</header>

<main>
  <header class="post-header wrap">
    <div class="entry__meta">
      <time datetime="{{DATE_ISO}}">{{DATE_DISPLAY}}</time>
      <span class="tag">{{TAG}}</span>
    </div>
    <h1>{{TITLE}}</h1>
    <p class="dek">{{DEK}}</p>
  </header>

  <div class="post-body wrap">
    <aside class="post-body__gutter">
      <span>{{READTIME}}</span>
      <span>{{TAG}}</span>
    </aside>
    <div class="post-body__content">
{{CONTENT}}
    </div>
  </div>

  <nav class="post-nav wrap">
    <a href="{{PREV_HREF}}" class="prev">
      <span class="label">← Previous</span>
      <span class="title">{{PREV_TITLE}}</span>
    </a>
    <a href="{{NEXT_HREF}}" class="next">
      <span class="label">Next →</span>
      <span class="title">{{NEXT_TITLE}}</span>
    </a>
  </nav>

  <!-- Comments Section -->
  <section class="comments-section">
    <h3 class="comments-title">Thoughts?</h3>
  
    <!-- Comment Submission Form -->
    <form id="comment-form" class="comment-form">
      <div class="form-row">
        <input type="text" id="comment-name" placeholder="Your name *" required maxlength="50">
        <input type="email" id="comment-email" placeholder="Your email (optional)" maxlength="100">
      </div>
      <textarea id="comment-body" placeholder="Join the discussion..." rows="4" required maxlength="1000"></textarea>
      <button type="submit" id="comment-submit-btn">Post Comment</button>
      <p id="comment-status" class="comment-status" aria-live="polite"></p>
    </form>
  
    <!-- Rendered Comments List -->
    <div id="comments-list" class="comments-list">
      <p class="loading-state">Loading comments...</p>
    </div>
  </section>

<!-- Supabase CDN and Client Initialization -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://edmcwxrslvpebvsjzjqi.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ncjy8aj1PJeOT4Bt8DCPqQ_T_gMNy17';
  window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>
<script src="js/comments.js"></script>

  </section>
</main>

<footer class="site-footer wrap">
  <p>heyNkemji — a journal for anything and everything.</p>
  <p class="footer-meta">Abuja ⇄ Accra · © <span id="year"></span></p>
</footer>

<script src="js/main.js"></script>
</body>
</html>
